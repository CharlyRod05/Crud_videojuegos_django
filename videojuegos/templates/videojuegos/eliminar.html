{% extends 'videojuegos/base.html' %}

{% block contenido %}
    <h1 class="mb-4">⚠️ Confirmar eliminación</h1>

    <p>¿Estás seguro de eliminar el videojuego <strong>"{{ videojuego.titulo }}"</strong>? Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'videojuegos:lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
